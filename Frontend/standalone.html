      --warning-text: #b45309;

      --critical: #ef4444;
      --critical-bg: #fef2f2;

      --critical-text: #b91c1c;

      --radius-md: 10px;
      --radius-lg: 16px;
      --radius-full: 9999px;

      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -1px rgba(0, 0, 0, 0.04);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-primary);
      background-color: var(--bg-app);
      color: var(--text-main);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
      transition: all 0.2s ease;
    }

    input, select, textarea {
      font-family: inherit;
      font-size: 0.95rem;
    }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in { animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    /* Utility Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: var(--radius-full);
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: capitalize;
    }

    .badge-critical, .badge-high {
      background: var(--critical-bg);
      color: var(--critical-text);
      border: 1px solid var(--critical-border);
    }

    .badge-medium {
      background: var(--warning-bg);
      color: var(--warning-text);
      border: 1px solid var(--warning-border);
    }

    .badge-low {
      background: #f1f5f9;
      color: var(--text-muted);
      border: 1px solid var(--border-color);
    }

    .badge-stage {
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
    }

    .badge-completed {
      background: var(--success-bg);
      color: var(--success-text);
      border: 1px solid var(--success-border);
    }

    /* Layout & Buttons */
    .container {
      max-width: 1360px;
      margin: 0 auto;
      padding: 0 24px 40px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 20px 24px;
      box-shadow: var(--shadow-sm);
      transition: box-shadow 0.2s ease;
    }

    .card:hover { box-shadow: var(--shadow-md); }

    .btn-primary {
      background: var(--primary);
      color: white;
      padding: 8px 16px;
      border-radius: var(--radius-md);
      font-weight: 600;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: white;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: var(--radius-md);
      font-weight: 600;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-secondary:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
    }

    .btn-ai {

      padding: 10px 20px;
      border-radius: var(--radius-md);
      font-weight: 700;
      font-size: 0.92rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: var(--ai-shadow);
    }

    .btn-ai:hover {
      opacity: 0.95;
      transform: translateY(-2px);
    }
  </style>
</head>

        const totalActive = relocations.length;
        const highPriority = relocations.filter(r => r.priority === 'High' || r.priority === 'Critical').length;
        
        const today = new Date('2026-08-07');
        const fourteenDaysFromNow = new Date('2026-08-21');
        const upcomingMoves = relocations.filter(r => {
          const moveDate = new Date(r.moveDate);
          return moveDate >= today && moveDate <= fourteenDaysFromNow;
        }).length;

        const pendingFollowups = relocations.reduce((acc, r) => acc + r.tasks.filter(t => !t.completed).length, 0);
        return { totalActive, highPriority, upcomingMoves, pendingFollowups };
      }, [relocations]);

        return relocations.filter(r => {

            r.customerName.toLowerCase().includes(searchTerm.toLowerCase()) ||
            r.sourceCity.toLowerCase().includes(searchTerm.toLowerCase()) ||
            r.destinationCity.toLowerCase().includes(searchTerm.toLowerCase()) ||
            r.id.toLowerCase().includes(searchTerm.toLowerCase());

          const matchesStage = stageFilter === 'ALL' || r.currentStage === stageFilter;
          const matchesPriority = priorityFilter === 'ALL' || r.priority === priorityFilter;

          return matchesSearch && matchesStage && matchesPriority;
        });

    // Relocation Details Component
    function RelocationDetails({ relocation, onBack, onUpdateStage, onToggleTask, onAddTask, onAddActivity }) {
      const [aiSummary, setAiSummary] = useState(null);
      const [aiNextAction, setAiNextAction] = useState(null);
      const [showAddTask, setShowAddTask] = useState(false);
      const [taskTitle, setTaskTitle] = useState('');
      const [actDesc, setActDesc] = useState('');

      const currentStageIndex = STAGES.indexOf(relocation.currentStage);

      const generateSummary = () => {
        const completed = relocation.tasks.filter(t => t.completed).length;
        const total = relocation.tasks.length;
        setAiSummary({
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          text: `[Status Update - ${relocation.customerName}]\nStage: ${relocation.currentStage} (${currentStageIndex+1}/9)\nMove Route: ${relocation.sourceCity} → ${relocation.destinationCity} on ${relocation.moveDate}\nChecklist: ${completed}/${total} tasks completed.\nSummary: Apartment confirmation complete. Packers locked. Fiber internet installation pending.`
        });
      };

      const suggestNextAction = () => {
        const uncompleted = relocation.tasks.filter(t => !t.completed);
        if (uncompleted.length > 0) {
          const top = uncompleted[0];
          setAiNextAction({
            title: `Follow Up: ${top.title}`,
            rationale: `Assigned to ${top.assignedTo}. Completing this unblocks stage progression before target move date ${relocation.moveDate}.`,
            taskId: top.id
          });
        } else {
          setAiNextAction({
            title: `Advance Stage to Next Step`,
            rationale: `All pending tasks complete. Ready to transition case to next milestone.`,
            advance: true
          });
        }
      };

      const submitTask = (e) => {
        e.preventDefault();
        if (!taskTitle) return;
        onAddTask(relocation.id, {
          id: 't_' + Date.now(),
          title: taskTitle,
          assignedTo: 'Operations Exec',
          dueDate: relocation.moveDate,
          priority: 'High',
          completed: false
        });
        setTaskTitle('');
        setShowAddTask(false);
      };

      const submitActivity = (e) => {
        e.preventDefault();
        if (!actDesc) return;
        onAddActivity(relocation.id, {
          id: 'a_' + Date.now(),
          time: new Date().toISOString().replace('T', ' ').substring(0, 16),
          title: 'Operations Note',
          desc: actDesc
        });
        setActDesc('');
      };

      return (
        <div style={{ padding: '24px 0 60px' }} className="animate-fade-in">
          <button onClick={onBack} className="btn-secondary" style={{ marginBottom: '18px' }}>← Back to Dashboard</button>

          {/* Banner */}
          <div className="card" style={{ marginBottom: '24px' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', flexWrap: 'wrap', gap: '16px', borderBottom: '1px solid var(--border-color)', paddingBottom: '16px' }}>
              <div>
                <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                  <h1 style={{ fontSize: '1.6rem', fontWeight: 800 }}>{relocation.customerName}</h1>
                  <span className={`badge badge-${relocation.priority.toLowerCase()}`}>{relocation.priority} Priority</span>
                  <span className="badge badge-stage">{relocation.currentStage}</span>
                </div>
                <div style={{ display: 'flex', gap: '16px', marginTop: '10px', fontSize: '0.88rem', color: 'var(--text-muted)' }}>
                  <span>📞 {relocation.phone}</span>
                  <span>✉️ {relocation.email}</span>
                  <span>📍 {relocation.sourceCity} → {relocation.destinationCity}</span>
                  <span>📅 Target Move: <strong>{relocation.moveDate}</strong></span>
                </div>
              </div>

              <div>
                <select
                  value={relocation.currentStage}
                  onChange={e => onUpdateStage(relocation.id, e.target.value)}
                  style={{ padding: '8px 12px', borderRadius: 'var(--radius-md)', border: '1px solid var(--border-color)', fontWeight: 600, color: 'var(--primary)' }}
                >
                  {STAGES.map(s => <option key={s} value={s}>{s}</option>)}
                </select>
              </div>
            </div>

            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(260px, 1fr))', gap: '12px', marginTop: '14px', fontSize: '0.85rem' }}>
              <div style={{ background: '#f8fafc', padding: '10px', borderRadius: '8px' }}><strong>Budget:</strong> {relocation.budget}</div>
              <div style={{ background: '#f8fafc', padding: '10px', borderRadius: '8px' }}><strong>Preference:</strong> {relocation.propertyPreference}</div>
              <div style={{ background: '#f8fafc', padding: '10px', borderRadius: '8px' }}><strong>Notes:</strong> {relocation.notes}</div>
            </div>
          </div>

          {/* Stepper Progress */}
          <div className="card" style={{ marginBottom: '24px' }}>
            <h3 style={{ fontSize: '1.1rem', fontWeight: 700, marginBottom: '16px' }}>Relocation Stage Stepper</h3>
            <div style={{ display: 'grid', gridTemplateColumns: `repeat(${STAGES.length}, 1fr)`, gap: '6px', overflowX: 'auto' }}>
              {STAGES.map((s, idx) => {
                const done = idx < currentStageIndex;
                const active = idx === currentStageIndex;
                return (
                  <div key={s} onClick={() => onUpdateStage(relocation.id, s)} style={{ textAlign: 'center', cursor: 'pointer', minWidth: '95px' }}>
                    <div style={{
                      width: '30px', height: '30px', borderRadius: '50%', margin: '0 auto 6px',
                      background: done ? 'var(--success)' : active ? 'var(--primary)' : '#e2e8f0',
                      color: 'white', fontWeight: 700, display: 'flex', alignItems: 'center', justifyContent: 'center'
                    }}>
                      {done ? '✓' : idx+1}
                    </div>
                    <span style={{ fontSize: '0.72rem', fontWeight: active ? 700 : 500, color: active ? 'var(--primary)' : 'var(--text-muted)' }}>{s}</span>
                  </div>
                );
              })}
            </div>
          </div>

          {/* Grid Layout */}
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(400px, 1fr))', gap: '24px' }}>
            {/* Tasks */}
            <div className="card">
              <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '16px' }}>
                <h3 style={{ fontSize: '1.1rem', fontWeight: 700 }}>Pending Tasks Checklist</h3>
                <button onClick={() => setShowAddTask(!showAddTask)} className="btn-secondary" style={{ padding: '4px 10px', fontSize: '0.8rem' }}>➕ Add Task</button>
              </div>

              {showAddTask && (
                <form onSubmit={submitTask} style={{ background: '#f8fafc', padding: '12px', borderRadius: '8px', marginBottom: '14px' }}>
                  <input
                    type="text"
                    placeholder="Task name..."
                    value={taskTitle}
                    onChange={e => setTaskTitle(e.target.value)}
                    style={{ width: '100%', padding: '8px', marginBottom: '8px', borderRadius: '6px', border: '1px solid #cbd5e1' }}
                  />
                  <button type="submit" className="btn-primary" style={{ padding: '6px 12px', fontSize: '0.8rem' }}>Save Task</button>
                </form>
              )}

              <div style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
                {relocation.tasks.map(t => (
                  <div key={t.id} style={{ display: 'flex', gap: '10px', padding: '10px', border: '1px solid #e2e8f0', borderRadius: '8px', background: t.completed ? '#f8fafc' : 'white' }}>
                    <button onClick={() => onToggleTask(relocation.id, t.id)} style={{ fontSize: '1.1rem' }}>
                      {t.completed ? '✅' : '⚪'}
                    </button>
                    <div>
                      <div style={{ fontWeight: 600, textDecoration: t.completed ? 'line-through' : 'none', color: t.completed ? 'var(--text-muted)' : '#0f172a' }}>{t.title}</div>
                      <div style={{ fontSize: '0.78rem', color: 'var(--text-muted)', marginTop: '2px' }}>👤 {t.assignedTo} • 📅 {t.dueDate}</div>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            {/* Activity Feed */}
            <div className="card">
              <h3 style={{ fontSize: '1.1rem', fontWeight: 700, marginBottom: '14px' }}>Activity History</h3>
              <form onSubmit={submitActivity} style={{ display: 'flex', gap: '8px', marginBottom: '14px' }}>
                <input
                  type="text"
                  placeholder="Log activity note..."
                  value={actDesc}
                  onChange={e => setActDesc(e.target.value)}
                  style={{ flex: 1, padding: '8px', borderRadius: '6px', border: '1px solid #cbd5e1' }}
                />
                <button type="submit" className="btn-secondary" style={{ padding: '8px 12px' }}>Log</button>
              </form>

              <div style={{ display: 'flex', flexDirection: 'column', gap: '12px', maxHeight: '280px', overflowY: 'auto' }}>
                {relocation.activities.map(a => (
                  <div key={a.id} style={{ borderLeft: '2px solid var(--primary)', paddingLeft: '10px' }}>
                    <div style={{ fontWeight: 700, fontSize: '0.85rem' }}>{a.title} <span style={{ fontSize: '0.74rem', color: 'var(--text-muted)', fontWeight: 400 }}>• {a.time}</span></div>
                    <div style={{ fontSize: '0.82rem', color: '#475569' }}>{a.desc}</div>
                  </div>
                ))}
              </div>
            </div>

            {/* AI Summary Card */}
            <div className="card" style={{ border: '1px solid #c084fc', background: '#faf5ff' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '12px' }}>
                <h3 style={{ fontSize: '1.1rem', fontWeight: 700, color: '#6b21a8' }}>✨ AI Relocation Summary</h3>
                <button onClick={generateSummary} className="btn-ai" style={{ padding: '6px 12px', fontSize: '0.8rem' }}>Generate Summary</button>
              </div>
              {aiSummary ? (
                <div style={{ background: 'white', padding: '12px', borderRadius: '8px', border: '1px solid #e9d5ff', whiteSpace: 'pre-line', fontSize: '0.88rem' }}>
                  {aiSummary.text}
                </div>
              ) : (
                <p style={{ fontSize: '0.85rem', color: '#7e22ce' }}>Click "Generate Summary" to produce a status update for customers.</p>
              )}
            </div>

            {/* AI Next Action Card */}
            <div className="card" style={{ border: '1px solid #60a5fa', background: '#eff6ff' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '12px' }}>
                <h3 style={{ fontSize: '1.1rem', fontWeight: 700, color: '#1e40af' }}>📈 AI Recommended Next Action</h3>
                <button onClick={suggestNextAction} className="btn-primary" style={{ padding: '6px 12px', fontSize: '0.8rem' }}>Suggest Next Action</button>
              </div>
              {aiNextAction ? (
                <div style={{ background: 'white', padding: '12px', borderRadius: '8px', border: '1px solid #bfdbfe' }}>
                  <h4 style={{ fontWeight: 700, color: '#0f172a' }}>{aiNextAction.title}</h4>
                  <p style={{ fontSize: '0.85rem', color: '#334155', marginTop: '4px' }}>{aiNextAction.rationale}</p>
                  {aiNextAction.taskId && (
                    <button onClick={() => { onToggleTask(relocation.id, aiNextAction.taskId); suggestNextAction(); }} className="btn-primary" style={{ marginTop: '10px', padding: '6px 12px', fontSize: '0.8rem', background: '#16a34a' }}>
                      ✓ Mark Task Complete
                    </button>
                  )}
                </div>
              ) : (
                <p style={{ fontSize: '0.85rem', color: '#1d4ed8' }}>Click "Suggest Next Action" for automated task prioritization.</p>
              )}
            </div>
          </div>
        </div>
      );
    }

    // App Component
    function App() {
      const [relocations, setRelocations] = useState(INITIAL_RELOCATIONS);
      const [selectedReloId, setSelectedReloId] = useState(null);
      const [activeTab, setActiveTab] = useState('dashboard');
      const [isAddModalOpen, setIsAddModalOpen] = useState(false);

      const selectedReloc = relocations.find(r => r.id === selectedReloId) || null;

      const handleUpdateStage = (reloId, newStage) => {
        setRelocations(prev => prev.map(r => r.id === reloId ? {
          ...r, currentStage: newStage,
          activities: [{ id: 'a_' + Date.now(), time: new Date().toISOString().replace('T', ' ').substring(0, 16), title: 'Stage Updated', desc: `Advanced to ${newStage}` }, ...r.activities]
        } : r));
      };

      const handleToggleTask = (reloId, taskId) => {
        setRelocations(prev => prev.map(r => r.id === reloId ? {
          ...r, tasks: r.tasks.map(t => t.id === taskId ? { ...t, completed: !t.completed } : t)
        } : r));
      };

      const handleAddTask = (reloId, newTask) => {
        setRelocations(prev => prev.map(r => r.id === reloId ? { ...r, tasks: [newTask, ...r.tasks] } : r));
      };

      const handleAddActivity = (reloId, newActivity) => {
        setRelocations(prev => prev.map(r => r.id === reloId ? { ...r, activities: [newActivity, ...r.activities] } : r));
      };

      const handleAddRelocation = (newRelo) => {
        setRelocations(prev => [newRelo, ...prev]);
        setSelectedReloId(newRelo.id);
      };

      const highPriorityCount = relocations.filter(r => r.priority === 'High' || r.priority === 'Critical').length;

      return (
        <div>
          <Header 
            activeTab={activeTab}
            setActiveTab={(tab) => { setActiveTab(tab); if (tab === 'dashboard') setSelectedReloId(null); }}
            onOpenAddModal={() => setIsAddModalOpen(true)}
            totalCases={relocations.length}
            highPriorityCount={highPriorityCount}
          />
          <main className="container">
            {selectedReloc ? (
              <RelocationDetails 
                relocation={selectedReloc}
                onBack={() => setSelectedReloId(null)}
                onUpdateStage={handleUpdateStage}
                onToggleTask={handleToggleTask}
                onAddTask={handleAddTask}
                onAddActivity={handleAddActivity}
              />
            ) : (
              <Dashboard 
                relocations={relocations}
                onSelectRelocation={(id) => setSelectedReloId(id)}
                onOpenAddModal={() => setIsAddModalOpen(true)}
              />
            )}
          </main>
          <AddRelocationModal 
            isOpen={isAddModalOpen}
            onClose={() => setIsAddModalOpen(false)}
            onAddRelocation={handleAddRelocation}
          />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
